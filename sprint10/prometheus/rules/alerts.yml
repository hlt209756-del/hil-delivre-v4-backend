# ─────────────────────────────────────────────────────────────────────────────
# Prometheus Alert Rules — Hil_Delivre v4
# ─────────────────────────────────────────────────────────────────────────────

groups:
  # ─── Alertes critiques (PagerDuty) ──────────────────────────────────────────
  - name: critical_alerts
    rules:
      - alert: APIDown
        expr: up{job="hil-delivre-api"} == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API Backend indisponible"
          description: "L'API Hil_Delivre est down depuis plus de 2 minutes."
          runbook: "https://docs.hildelivre.bf/runbooks/api-down"

      - alert: HighErrorRate
        expr: rate(errors_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Taux d'erreurs élevé"
          description: "Plus de 10 erreurs/seconde détectées sur les 5 dernières minutes."
          runbook: "https://docs.hildelivre.bf/runbooks/high-error-rate"

      - alert: PaymentFailures
        expr: rate(payments_failed_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Échecs de paiement en série"
          description: "Plus de 5 échecs de paiement par seconde. Vérifier PayDunya."
          runbook: "https://docs.hildelivre.bf/runbooks/payment-failures"

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "PostgreSQL indisponible"
          description: "La base de données PostgreSQL ne répond plus."
          runbook: "https://docs.hildelivre.bf/runbooks/db-down"

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redis indisponible"
          description: "Le cache Redis ne répond plus. L'application fonctionne en mode dégradé."
          runbook: "https://docs.hildelivre.bf/runbooks/redis-down"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Espace disque critique (< 5%)"
          description: "L'espace disque disponible est inférieur à 5%."

  # ─── Alertes warning (Slack) ────────────────────────────────────────────────
  - name: warning_alerts
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Latence P95 élevée (> 2s)"
          description: "Le 95e percentile de la latence dépasse 2 secondes depuis 5 minutes."

      - alert: CacheHitRatioLow
        expr: cache_hit_ratio < 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Cache hit ratio faible (< 50%)"
          description: "Le taux de cache hit est inférieur à 50% depuis 10 minutes. Vérifier Redis."

      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1073741824) > 0.85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Usage mémoire élevé (> 85%)"
          description: "L'utilisation mémoire du processus dépasse 85%."

      - alert: SocketOverload
        expr: connected_sockets > 5000
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Surcharge Socket.IO (> 5000 connexions)"
          description: "Le nombre de connexions Socket.IO dépasse 5000."

      - alert: LowDeliverersOnline
        expr: online_deliverers < 3 and hour() >= 10 and hour() <= 22
        for: 15m
        labels:
          severity: warning
          team: operations
        annotations:
          summary: "Peu de livreurs en ligne (< 3) en heures de pointe"
          description: "Moins de 3 livreurs sont en ligne pendant les heures d'activité."

      - alert: OrderCompletionSlow
        expr: histogram_quantile(0.5, rate(order_completion_duration_seconds_bucket[1h])) > 2700
        for: 30m
        labels:
          severity: warning
          team: operations
        annotations:
          summary: "Temps médian de livraison élevé (> 45 min)"
          description: "Le temps médian de complétion des commandes dépasse 45 minutes."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Mémoire Redis élevée (> 80%)"
          description: "L'utilisation mémoire de Redis dépasse 80% du maximum configuré."

      - alert: DiskSpaceWarning
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Espace disque faible (< 20%)"
          description: "L'espace disque disponible est inférieur à 20%."

  # ─── Alertes info (Slack monitoring) ────────────────────────────────────────
  - name: info_alerts
    rules:
      - alert: CashBalanceHigh
        expr: max(deliverer_cash_balance) > 500000
        for: 1h
        labels:
          severity: info
          team: finance
        annotations:
          summary: "Solde cash livreur élevé (> 500 000 FCFA)"
          description: "Un livreur a un solde cash supérieur à 500 000 FCFA. Réconciliation nécessaire."

      - alert: KYCPendingLong
        expr: kyc_pending_count > 0 and kyc_pending_oldest_hours > 24
        for: 1h
        labels:
          severity: info
          team: operations
        annotations:
          summary: "KYC en attente depuis plus de 24h"
          description: "Des demandes KYC sont en attente depuis plus de 24 heures."

      - alert: NewDeployment
        expr: changes(process_start_time_seconds[5m]) > 0
        labels:
          severity: info
          team: devops
        annotations:
          summary: "Nouveau déploiement détecté"
          description: "Un nouveau déploiement de l'API a été détecté."
