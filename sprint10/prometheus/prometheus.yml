# ─────────────────────────────────────────────────────────────────────────────
# Prometheus Configuration — Hil_Delivre v4
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: 'production'
    service: 'hil-delivre'
    region: 'af-south-1'

# ─── Alerting ─────────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# ─── Rules ────────────────────────────────────────────────────────────────────
rule_files:
  - '/etc/prometheus/rules/*.yml'

# ─── Scrape Configs ───────────────────────────────────────────────────────────
scrape_configs:
  # Backend API (métriques applicatives)
  - job_name: 'hil-delivre-api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/api/monitoring/metrics'
    scheme: 'https'
    bearer_token_file: '/etc/prometheus/secrets/metrics_token'
    static_configs:
      - targets:
          - 'api.hildelivre.bf'
        labels:
          service: 'api'
          tier: 'backend'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-production'

  # Redis Exporter
  - job_name: 'redis'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          service: 'redis'
          tier: 'data'

  # Node Exporter (métriques système)
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'host'
          tier: 'infrastructure'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          service: 'prometheus'
          tier: 'monitoring'
