version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Hil_Delivre v4 — Stack complète de développement / staging
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hil-delivre-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PAYDUNYA_MASTER_KEY=${PAYDUNYA_MASTER_KEY}
      - PAYDUNYA_PRIVATE_KEY=${PAYDUNYA_PRIVATE_KEY}
      - PAYDUNYA_PUBLIC_KEY=${PAYDUNYA_PUBLIC_KEY}
      - PAYDUNYA_TOKEN=${PAYDUNYA_TOKEN}
      - PAYDUNYA_WEBHOOK_TOKEN=${PAYDUNYA_WEBHOOK_TOKEN}
      - AFRICAS_TALKING_API_KEY=${AFRICAS_TALKING_API_KEY}
      - AFRICAS_TALKING_USERNAME=${AFRICAS_TALKING_USERNAME}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
      - OSRM_BASE_URL=http://osrm:5000
      - SENTRY_DSN=${SENTRY_DSN}
      - PROMETHEUS_METRICS_TOKEN=${PROMETHEUS_METRICS_TOKEN}
      - APP_VERSION=4.10.0
      # Cron jobs
      - CRON_DISABLE_DAILY_STATS=false
      - CRON_DISABLE_HEALTH_CHECK=false
      - CRON_DISABLE_CLEANUP_OTP=false
      - CRON_DISABLE_CLEANUP_EXPORTS=false
      - CRON_DISABLE_CACHE_WARMUP=false
    depends_on:
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/monitoring/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hil-network
    volumes:
      - ./backend/src:/app/src:ro
      - api-logs:/app/logs

  # ─── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hil-delivre-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
      --timeout 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hil-network
    volumes:
      - redis-data:/data

  # ─── OSRM Routing Engine ───────────────────────────────────────────────────
  osrm:
    image: osrm/osrm-backend:latest
    container_name: hil-delivre-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/burkina-faso-latest.osrm
    volumes:
      - osrm-data:/data
    networks:
      - hil-network

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: hil-delivre-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hil-network

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: hil-delivre-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-hildelivre2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - hil-network

  # ─── Redis Exporter (pour Prometheus) ───────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: hil-delivre-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hil-network

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  hil-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
    driver: local
  osrm-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  api-logs:
    driver: local
