# ─────────────────────────────────────────────────────────────────────────────
# Hil_Delivre v4 — CI Pipeline (Pull Requests & Pushes)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test

jobs:
  # ─── Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Run unit tests with coverage
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-ci
          PROMETHEUS_METRICS_TOKEN: test-token
        run: npm test -- --coverage --forceExit --detectOpenHandles

      - name: Check coverage thresholds
        working-directory: backend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage below 70% threshold!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage/

  # ─── E2E Tests ──────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Run E2E tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: test-secret-ci
          PROMETHEUS_METRICS_TOKEN: test-token
        run: npm run test:e2e -- --forceExit --detectOpenHandles

  # ─── Security Audit ─────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: backend
        continue-on-error: true
      - run: npm audit --audit-level=high
        working-directory: backend

  # ─── Docker Build Test ──────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hil-delivre-api:test backend/
      - name: Test Docker image
        run: |
          docker run -d --name test-api \
            -e NODE_ENV=test \
            -e PORT=3000 \
            -e JWT_SECRET=test \
            -e PROMETHEUS_METRICS_TOKEN=test \
            -p 3000:3000 \
            hil-delivre-api:test
          sleep 10
          curl -sf http://localhost:3000/api/monitoring/health || exit 1
          docker stop test-api
