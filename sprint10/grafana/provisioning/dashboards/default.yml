# ─────────────────────────────────────────────────────────────────────────────
# Grafana Dashboard Provisioning — Hil_Delivre v4
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: 'Hil_Delivre'
    orgId: 1
    folder: 'Hil_Delivre v4'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
