# ============================================================
# Hil_Delivre v4 — Workflow CI/CD Backend
# Sprint 1 : Infrastructure
# ============================================================
# Ce workflow s'exécute à chaque push sur les branches principales
# et sur chaque PR ciblant la branche main. Il effectue le linting,
# les tests unitaires, et déploie vers l'environnement de staging
# après validation.
# ============================================================

name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend_ci_cd.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend_ci_cd.yml'

env:
  NODE_VERSION: '18'

jobs:
  # ============================================================
  # Job 1 : Linting & Tests
  # ============================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        env:
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          CORS_ORIGINS: http://localhost:8080
          PORT: 3001
        run: npm test

  # ============================================================
  # Job 2 : Build & Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --production

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high || true

  # ============================================================
  # Job 3 : Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Déploiement staging — configuration à finaliser au Sprint 9."
          echo "Plateforme cible : Render / AWS ECS"
        env:
          DEPLOY_ENV: staging

  # ============================================================
  # Job 4 : Deploy to Production
  # ============================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Déploiement production — configuration à finaliser au Sprint 9."
          echo "Plateforme cible : Render / AWS ECS"
        env:
          DEPLOY_ENV: production
